name: Build Windows Desktop

# 触发方式：
#  1) 每次推送到 main 都会构建并上传构建产物（不自动发正式 Release）
#  2) 打 tag（如 v1.0.0）会自动发布一个带安装包/便携 zip 的 GitHub Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:   # 也支持手动点击 "Run workflow"

jobs:
  build-windows:
    runs-on: windows-latest   # 已预装 VS2022 + Flutter 构建依赖
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Flutter（stable）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 判断版本号：tag 就取 tag，否则取时间戳
      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # 项目未提交 windows/ 平台目录，先自动生成 Windows 桌面支持
      - name: Add Windows platform support
        run: flutter create --platforms=windows .

      # 把窗口标题改成中文「Cloudflare 管理器」，并加大默认窗口尺寸
      - name: Localize window title & size
        shell: pwsh
        run: |
          $f = "windows/runner/main.cpp"
          (Get-Content $f -Raw -Encoding UTF8) `
            -replace 'window\.Create\(L"cloudflare_manager", L"cloudflare_manager"', 'window.Create(L"Cloudflare 管理器", L"Cloudflare 管理器"' `
            -replace 'window\.SetSize\(1280, 720\)', 'window.SetSize(1366, 800)' |
            Out-File $f -Encoding UTF8 -NoNewline
          Select-String -Path $f -Pattern "window.Create" | ForEach-Object { $_.Line.Trim() }

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # 打包成便携 zip（解压即用，双击 exe）
      - name: Package portable zip
        shell: bash
        run: |
          mkdir -p package
          # 拷贝可执行文件与其依赖的 DLL / 资源
          BUILD_DIR="build/windows/x64/runner/Release"
          cp "$BUILD_DIR"/*.exe "$BUILD_DIR"/*.dll package/ 2>/dev/null || true
          cp -r "$BUILD_DIR"/data package/ 2>/dev/null || true
          cd package
          # 生成清单/说明
          printf "双击 cloudflare_manager.exe 即可运行。\n本文件夹包含运行时所需 DLL 与资源，请整体保留。\n" > 使用说明.txt
          cd ..
          ROOT="cloudflare-manager-windows-${{ steps.meta.outputs.version }}"
          mv package "$ROOT"
          powershell -Command "Compress-Archive -Path '$ROOT' -DestinationPath 'cloudflare_manager_windows_${{ steps.meta.outputs.version }}.zip' -Force"
          ls -la *.zip

      # 生成安装程序 Setup.exe（Inno Setup）
      - name: Build Setup.exe with Inno Setup
        shell: pwsh
        run: |
          # 下载并安装 Inno Setup（静默安装）
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Installing Inno Setup..."
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:TEMP\innosetup.exe" -UseBasicParsing
            Start-Process -Wait -FilePath "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          }
          Write-Host "ISCC exists: $(Test-Path $iscc)"
          if (Test-Path $iscc) {
            & $iscc "installer.iss"
            Write-Host "=== installer-output contents ==="
            Get-ChildItem "installer-output" | Select-Object Name,Length
          } else {
            Write-Host "::error::Inno Setup not found after install"
            exit 1
          }

      # 上传构建产物（main 分支时，可在 Actions 页手动下载）
      - name: Upload portable zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: cloudflare_manager_windows_*.zip
          if-no-files-found: warn

      - name: Upload setup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer-output/*.exe
          if-no-files-found: warn

      # 打 tag 时发布正式 Release
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Cloudflare 管理器 Windows ${{ steps.meta.outputs.version }}"
          body: |
            Windows 桌面版安装程序与便携包。

            ## 下载
            - 🔧 `cloudflare_manager_setup_*.exe`：**安装程序**，双击按向导安装即可
            - 📦 `cloudflare_manager_windows_*.zip`：便携版，解压后双击 exe 使用

            ## 使用（安装程序版）
            1. 下载 `cloudflare_manager_setup_*.exe`
            2. 双击 → 按向导完成安装
            3. 从开始菜单或桌面打开"Cloudflare 管理器"

            ## 登录
            默认账号 admin / admin（登录后请修改），然后添加 Cloudflare API Token 即可。

            ⚠️ 程序未做数字签名，首次运行若提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」即可。
          files: |
            cloudflare_manager_windows_*.zip
            installer-output/cloudflare_manager_setup_*.exe
          fail_on_unmatched_files: false